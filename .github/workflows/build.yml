name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Imposta Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Rendi eseguibile gradlew
        run: chmod +x gradlew

      - name: Compila l'APK di debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Carica l'APK come download
        uses: actions/upload-artifact@v4
        with:
          name: RitagliaColora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
